name: Sync Card Catalog

on:
  # CAT-2B0 — scheduled execution is TEMPORARILY PAUSED.
  # TCGdex renamed four Trainer Gallery set IDs (swsh{9,10,11,12}.5tg ->
  # swsh{9,10,11,12}tg). An unattended incremental run would ingest 120 cards whose
  # (name, set_name, local_id) triples duplicate rows already stored under the old
  # namespaces, creating conflicting physical-printing identities. Restore the
  # `schedule:` trigger only once the durable identity guard lands in CAT-2B.
  # Manual `workflow_dispatch` below is intentionally left fully operational.
  workflow_dispatch:
    inputs:
      sync_mode:
        description: 'Sync mode'
        required: true
        default: 'incremental'
        type: choice
        options:
          - incremental
          - full
          - temporal
      set_id:
        description: 'Optional single-set scope for temporal validation, e.g. swsh3. Leave blank for all sets. Temporal mode only.'
        required: false
        default: ''
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SYNC_MODE: ${{ github.event.inputs.sync_mode || 'incremental' }}
          SYNC_SET_ID: ${{ github.event.inputs.set_id || '' }}
